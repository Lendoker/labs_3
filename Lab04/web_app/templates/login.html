{% extends "base.html" %}
{% block title %}Вхід{% endblock %}
{% block content %}
<h1>Вхід до бібліотеки</h1>
<form method="post" class="card form">
    <label>Логін <input name="username" required autocomplete="username"></label>
    <label>Пароль <input name="password" type="password" required autocomplete="current-password"></label>
    <button type="submit">Увійти</button>
</form>
<p><a href="{{ url_for('register') }}">Зареєструватися як читач</a></p>
{% endblock %}
